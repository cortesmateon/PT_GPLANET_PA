<div class="dash-hero">
  <div class="dash-hero-eyebrow">Prueba_GPLANET</div>
  <h1 class="dash-hero-title">Hola, {{ primerNombre() }} 👋</h1>
  <p class="dash-hero-sub">Bienvenido. Elige una sección para empezar.</p>
</div>

@if (secciones().length === 0) {
  <div class="card">
    <div class="card-body" style="text-align:center; padding:3rem; color:var(--muted);">
      <p>No tienes secciones asignadas todavía.</p>
    </div>
  </div>
} @else {
  <div class="sistemas-grid">
    @for (s of secciones(); track s.path) {
      <div class="sistema-card" (click)="abrir(s.path)">
        <div class="sistema-card-top">
          <div class="sistema-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="26" height="26">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="s.icon"/>
            </svg>
          </div>
          <div class="sistema-arrow">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
          </div>
        </div>
        <div>
          <div class="sistema-nombre">{{ s.label }}</div>
          <p class="sistema-desc">Ir a {{ s.label }}</p>
        </div>
        <div class="sistema-abrir">Abrir</div>
      </div>
    }
  </div>
}
